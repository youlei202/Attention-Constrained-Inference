[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-constrained-inference"
version = "0.2.0"
description = "Numerical experiments for attention-constrained inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ACI authors"}]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "pyarrow>=12",
  "joblib>=1.3",
  "PyYAML>=6",
  "tqdm>=4.65",
  "SciencePlots>=2.1",
]

[tool.setuptools.packages.find]
include = ["acli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
